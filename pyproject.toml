[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starter"
version = "0.1.0"
description = "Python starter project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
starter = "starter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/starter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
